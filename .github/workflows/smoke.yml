# Smoke — real harness CLIs against LLM providers (level 3)
#
# Triggers: weekly schedule + manual dispatch ONLY (never PRs — fork PRs must
# never see secrets). Requires the `smoke` Environment with OPENCODE_ZEN_API_KEY
# (default provider) and optionally NVIDIA_API_KEY (fallback).
name: Smoke

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC — cheap models, tiny prompts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: smoke
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install harness CLIs
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install -g @openai/codex

      - name: "Run smoke tests (default provider: Zen)"
        run: npx vitest run --config vitest.smoke.config.ts
