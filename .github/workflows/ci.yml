# CI — typecheck, tests, coverage gate, shell lint
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The MCP server has its own manifest and lockfile. Its types are needed
      # for the typecheck below, and constitution Art. 2.2 requires the
      # lockfile to be installable.
      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Typecheck
        run: npm run typecheck

      # mcp-server ships its own toolchain (TS 7 + @types/node 26, aligned
      # with the root in #78/#80). The root typecheck above already covers
      # these files, but only this step proves the component is
      # self-consistent for the toolchain it actually declares.
      - name: Typecheck MCP server with its own toolchain
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: mcp-server

      - name: Test
        run: npm test

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-server

      # Enforces constitution Art. 4.1. The thresholds live in
      # vitest.config.ts and must match this job (Art. 4.4).
      - name: Coverage
        run: npm run test:coverage

  shell:
    name: shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install.sh is what users pipe into bash; update-multiple-projects.sh
      # runs against several repositories at once. Neither was ever linted.
      - name: ShellCheck
        run: shellcheck install.sh update-multiple-projects.sh
