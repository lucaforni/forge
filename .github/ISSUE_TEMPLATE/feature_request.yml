name: ✨ Feature request
description: Propose a new feature or improvement
title: "[Feature]: "
labels: [enhancement, triage]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Describe the problem and the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? e.g. "I'm frustrated when…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you evaluated other solutions or workarounds?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples, links or other useful references
  - type: dropdown
    id: track
    attributes:
      label: Estimated FORGE track (optional)
      description: How big do you think this is?
      options:
        - Not sure
        - Quick (< 1 day)
        - Feature (1-5 days)
        - Epic (weeks)
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that no similar issue or PR already exists
          required: true
        - label: I'm willing to contribute a PR (optional)
          required: false
